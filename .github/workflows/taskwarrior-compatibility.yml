name: Taskwarrior Compatibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  taskwarrior:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        taskwarrior:
          - version: "3.4.2"
            sha256: "d302761fcd1268e4a5a545613a2b68c61abd50c0bcaade3b3e68d728dd02e716"
          - version: "3.5.0"
            sha256: "9ea64b411f8314414f440ec765dfdf5a86c9f6159df47e2f60cff3db6b31157a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgnutls28-dev uuid-dev libncurses-dev libreadline-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt asciichartpy

      - name: Install Taskwarrior ${{ matrix.taskwarrior.version }}
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/GothenburgBitFactory/taskwarrior/releases/download/v${{ matrix.taskwarrior.version }}/task-${{ matrix.taskwarrior.version }}.tar.gz" \
            --output "/tmp/task-${{ matrix.taskwarrior.version }}.tar.gz"
          echo "${{ matrix.taskwarrior.sha256 }}  /tmp/task-${{ matrix.taskwarrior.version }}.tar.gz" | sha256sum --check
          tar -xzf "/tmp/task-${{ matrix.taskwarrior.version }}.tar.gz" -C /tmp
          cmake -S "/tmp/task-${{ matrix.taskwarrior.version }}" -B "/tmp/task-${{ matrix.taskwarrior.version }}-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "/tmp/task-${{ matrix.taskwarrior.version }}-build" --parallel
          sudo cmake --install "/tmp/task-${{ matrix.taskwarrior.version }}-build"

      - name: Show runtime versions
        run: |
          python3 --version
          task --version
          test "$(task --version)" = "${{ matrix.taskwarrior.version }}"

      - name: Run golden correctness suite
        env:
          NAUTICAL_REQUIRE_ASTRAL: "1"
        run: python3 dev_tools/nautical_golden_tests.py

      - name: Run Taskwarrior integration lifecycle
        run: python3 dev_tools/nautical_black_box_test.py --json
