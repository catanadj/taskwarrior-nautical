name: Performance Budget

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y taskwarrior
          python3 -m pip install -r requirements.txt

      - name: Verify benchmark runtime
        run: |
          task --version
          python3 - <<'PY'
          from importlib.metadata import version

          for package in ("astral", "python-dateutil", "rich"):
              print(f"{package} {version(package)}")
          PY

      - name: Show Python version
        run: python3 --version

      - name: Enforce performance budgets (head)
        run: |
          set -o pipefail
          python3 dev_tools/nautical_perf_budget.py --json --enforce --budget-file dev_tools/perf_budget.json | tee perf-budget-report-head.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("perf-budget-report-head.json").read_text())
          if report.get("ok") is not True or report.get("failed_checks"):
              raise SystemExit(f"performance budget report is not clean: {report.get('failed_checks')!r}")
          if report.get("profile") != "desktop":
              raise SystemExit(f"unexpected benchmark profile: {report.get('profile')!r}")
          PY

      - name: Upload performance report artifact (head)
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report-head
          path: perf-budget-report-head.json
          if-no-files-found: error

      - name: Enforce extended workflow budgets (head)
        run: |
          set -o pipefail
          python3 dev_tools/nautical_perf_budget.py --extended --workflows-only --json --enforce --budget-file dev_tools/perf_budget.json | tee perf-budget-report-extended.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("perf-budget-report-extended.json").read_text())
          if report.get("ok") is not True or report.get("failed_checks"):
              raise SystemExit(f"extended performance report is not clean: {report.get('failed_checks')!r}")
          if report.get("profile") != "desktop":
              raise SystemExit(f"unexpected extended benchmark profile: {report.get('profile')!r}")
          PY

      - name: Upload extended performance report artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report-extended
          path: perf-budget-report-extended.json
          if-no-files-found: error

      - name: Prepare base worktree (PR only)
        if: github.event_name == 'pull_request'
        run: git worktree add ../perf-base "${{ github.event.pull_request.base.sha }}"

      - name: Measure performance budgets (base, PR only)
        if: github.event_name == 'pull_request'
        run: |
          python3 ../perf-base/dev_tools/nautical_perf_budget.py --json --budget-file ../perf-base/dev_tools/perf_budget.json > perf-budget-report-base.json

      - name: Compare head vs base trend (PR only)
        if: github.event_name == 'pull_request'
        run: |
          python3 dev_tools/nautical_perf_compare.py --base perf-budget-report-base.json --head perf-budget-report-head.json > perf-trend-report.md
          cat perf-trend-report.md >> "$GITHUB_STEP_SUMMARY"
          python3 dev_tools/nautical_perf_compare.py --base perf-budget-report-base.json --head perf-budget-report-head.json --json --enforce > perf-trend-report.json

      - name: Upload performance report artifacts (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-report-base-and-trend
          path: |
            perf-budget-report-base.json
            perf-trend-report.json
            perf-trend-report.md
          if-no-files-found: error

      - name: Cleanup base worktree (PR only)
        if: github.event_name == 'pull_request'
        run: git worktree remove ../perf-base --force
