name: Type Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y taskwarrior
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install mypy
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install mypy

      - name: Install test tooling
        run: python3 -m pip install -r requirements-test.txt

      - name: Run mypy
        run: python3 -m mypy --config-file mypy.ini

      - name: Run strict boundary mypy
        run: >-
          python3 -m mypy --config-file mypy.ini
          --enable-error-code=union-attr
          --enable-error-code=attr-defined
          --enable-error-code=assignment
          --enable-error-code=arg-type
          --enable-error-code=return-value
          --enable-error-code=operator
          nautical_core/lifecycle_outbox.py
          nautical_core/hook_protocol.py
          nautical_core/task_command.py
          nautical_core/runtime.py
          nautical_core/hook_support.py
          nautical_core/modify_runtime.py
          nautical_core/modify_models.py
          nautical_core/recurrence_evaluator.py
          nautical_core/modify_completion_flow.py
          nautical_core/modify_completion_compute.py
          nautical_core/modify_completion_spawn.py
          nautical_core/exit_runtime.py
          nautical_core/lifecycle_application.py
          nautical_core/taskwarrior_mutations.py
          nautical_core/occurrence_provider.py
          nautical_core/scheduler_trace.py
          nautical_core/scheduler_service.py

      - name: Run normal-import facade and query boundary mypy
        run: >-
          python3 -m mypy --config-file mypy.ini --follow-imports=normal
          nautical_core/task_datetime.py
          nautical_core/api_bindings.py
          nautical_core/compat_api.py
          nautical_core/architecture_contract.py
          nautical_core/integration_context.py
          nautical_core/query_service.py
          nautical_core/parser_api.py
          nautical_core/scheduler_api.py
          nautical_core/cache_api.py
          nautical_core/core_context.py
          nautical_core/recurrence_context.py
          nautical_core/hook_bootstrap.py
          nautical_core/occurrence_provider.py

      - name: Run full strict package mypy
        run: >-
          python3 -m mypy --config-file mypy.ini
          --enable-error-code=union-attr
          --enable-error-code=attr-defined
          --enable-error-code=assignment
          --enable-error-code=arg-type
          --enable-error-code=return-value
          --enable-error-code=operator
          nautical_core

      - name: Run strict operator control-plane mypy
        run: >-
          python3 -m mypy --config-file mypy.ini
          --disallow-untyped-defs
          --disallow-incomplete-defs
          --enable-error-code=union-attr
          --enable-error-code=attr-defined
          --enable-error-code=assignment
          --enable-error-code=arg-type
          --enable-error-code=return-value
          --enable-error-code=operator
          nautical_core/operator_models.py
          nautical_core/operator_findings.py
          nautical_core/operator_snapshot.py
          nautical_core/operator_inspectors.py
          nautical_core/operator_plans.py
          nautical_core/operator_domain_plans.py
          nautical_core/operator_domain_planner.py
          nautical_core/operator_application.py
          nautical_core/operator_control_plane.py
          nautical_core/operator_context.py
          nautical_core/operator_presentation.py
          nautical_core/integrity_query_service.py
          nautical_core/integrity_audit_service.py
          nautical_core/queue_status_service.py
          nautical_core/reconcile_report.py

      - name: Run unit suite with branch-coverage floor
        env:
          COVERAGE_FILE: /tmp/nautical-coverage-data
        run: >-
          PYTHONPATH=.
          PYTHONPYCACHEPREFIX=/tmp/nautical-readiness-pycache
          python3 -m coverage run -m unittest discover -s tests -q

      - name: Enforce branch-coverage floor and write XML report
        env:
          COVERAGE_FILE: /tmp/nautical-coverage-data
        run: |
          python3 -m coverage report --fail-under=44 --show-missing
          python3 -m coverage xml -o coverage.xml

      - name: Upload branch-coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nautical-branch-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Run deployment sanity checks
        run: python3 dev_tools/nautical_deploy_sanity.py --json

      - name: Run architecture contract tests
        run: PYTHONPATH=. python3 -m unittest tests.test_architecture_contract -q
