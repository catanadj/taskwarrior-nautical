name: Stress CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stress-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt asciichartpy

      - name: Install Taskwarrior
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgnutls28-dev uuid-dev libncurses-dev libreadline-dev
          curl --fail --silent --show-error --location \
            https://github.com/GothenburgBitFactory/taskwarrior/releases/download/v3.4.2/task-3.4.2.tar.gz \
            --output /tmp/task-3.4.2.tar.gz
          echo "d302761fcd1268e4a5a545613a2b68c61abd50c0bcaade3b3e68d728dd02e716  /tmp/task-3.4.2.tar.gz" | sha256sum --check
          tar -xzf /tmp/task-3.4.2.tar.gz -C /tmp
          cmake -S /tmp/task-3.4.2 -B /tmp/task-3.4.2-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/task-3.4.2-build --parallel
          sudo cmake --install /tmp/task-3.4.2-build

      - name: Show tool versions
        run: |
          python3 --version
          task --version
          test "$(task --version)" = "3.4.2"

      - name: Run golden correctness suite
        env:
          NAUTICAL_REQUIRE_ASTRAL: "1"
        run: |
          python3 dev_tools/nautical_golden_tests.py

      - name: Run Taskwarrior integration lifecycle
        run: |
          set -o pipefail
          python3 dev_tools/nautical_black_box_test.py --json | tee taskwarrior-integration-report.json

      - name: Run end-to-end hook latency benchmark
        run: |
          python3 dev_tools/load_test_nautical.py --tasks 30 --done-rate 1 --anchor-rate 0.5 --cp-rate 0.5 --limit-p95 1.0 --limit-done-p95 2.0 --json --enforce | tee e2e-latency-report.json

      - name: Run CI stress profile
        run: |
          set -o pipefail
          python3 dev_tools/nautical_stress_campaign.py --profile ci --json --enforce | tee stress-ci-report.json

      - name: Append stress summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Stress CI")
          print("")
          raw = Path("stress-ci-report.json").read_text(encoding="utf-8") if Path("stress-ci-report.json").exists() else ""
          if not raw.strip():
              print("- report: `missing or empty`")
              raise SystemExit(0)
          try:
              report = json.loads(raw)
          except Exception as exc:
              print(f"- report: `invalid JSON ({exc})`")
              raise SystemExit(0)
          print(f"- ok: `{report.get('ok')}`")
          print(f"- duration_s: `{report.get('duration_s')}`")
          print(f"- task_available: `{report.get('task_available')}`")
          failed = report.get("failed_stages") or []
          print(f"- failed_stages: `{', '.join(failed) if failed else 'none'}`")
          print("")
          print("| Stage | Status | Duration (s) |")
          print("| --- | --- | ---: |")
          for stage in report.get("stages", []):
              print(f"| {stage.get('stage', '')} | {stage.get('status', '')} | {stage.get('duration_s', '')} |")
          PY

      - name: Upload stress report artifact
        uses: actions/upload-artifact@v4
        with:
          name: stress-ci-report
          path: |
            stress-ci-report.json
            e2e-latency-report.json
            taskwarrior-integration-report.json
          if-no-files-found: error
