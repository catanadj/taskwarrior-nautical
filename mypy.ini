[mypy]
python_version = 3.11
files = nautical_core
show_error_codes = True
pretty = True
ignore_missing_imports = True
follow_imports = skip
no_implicit_optional = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
disable_error_code = union-attr,attr-defined,assignment,arg-type,return-value,operator

# Orchestration boundaries are typed independently of the legacy hook modules.
# This catches missing callback annotations without forcing heterogeneous
# Taskwarrior JSON payloads through an artificial schema.
[mypy-nautical_core.modify_runtime]
disallow_untyped_defs = True
disallow_incomplete_defs = True
enable_error_code = union-attr,attr-defined,assignment,arg-type,return-value,operator

[mypy-nautical_core.modify_models]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-nautical_core.recurrence_evaluator]
